buildscript {
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
    }
}

plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def releaseSigning = [
    storeFile: System.getenv('WAKEMATE_KEYSTORE_FILE'),
    storePassword: System.getenv('WAKEMATE_KEYSTORE_PASSWORD'),
    keyAlias: System.getenv('WAKEMATE_KEY_ALIAS'),
    keyPassword: System.getenv('WAKEMATE_KEY_PASSWORD')
]
def hasReleaseSigning = releaseSigning.values().every { it != null && !it.isEmpty() }
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }
            && !hasReleaseSigning) {
        throw new GradleException('Release signing is required. Use scripts/build_signed_apks.ps1.')
    }
}

android {
    namespace "com.example.my_app"
    compileSdkVersion flutter.compileSdkVersion

    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.example.my_app"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
    }

    flavorDimensions "alertness"

    productFlavors {
        legacy {
            dimension "alertness"
            resValue "string", "app_name", "WakeMate"
        }
        pvtb {
            dimension "alertness"
            applicationIdSuffix ".pvtb"
            versionNameSuffix "-pvtb"
            resValue "string", "app_name", "WakeMate PVT-B"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        production {
            if (hasReleaseSigning) {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.production
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

flutter {
    source '../..'
}
